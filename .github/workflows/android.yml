name: Android APK

# Builds the Godot port (godot/) into a signed arm64 APK. Every push to main
# publishes it as a GitHub release named after package.json's version; pull
# requests that touch the port build it and attach the APK to the run.
on:
  push:
    branches: [main]
  pull_request:
    paths: ['godot/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_DIST: ${{ github.workspace }}/../godot-dist

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIST }}
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Install Godot
        run: |
          mkdir -p "$GODOT_DIST"
          cd "$GODOT_DIST"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          [ -f editor.zip ] || curl -fsSL -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -oq editor.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -oq templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tdir/"
          godot --version

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            user="$KEY_ALIAS"; pass="$KEYSTORE_PASSWORD"
          else
            # No release key configured: a throwaway key still yields an installable APK.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key (updates will need a reinstall)."
            pass="$(openssl rand -hex 16)"; user="throwaway"
            keytool -genkeypair -keystore "$ks" -alias "$user" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=Arena Legends" >/dev/null 2>&1
          fi
          echo "::add-mask::$pass"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$user"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Editor settings (Android SDK, JDK)
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platform-tools" >/dev/null
          dbg="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$dbg" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          conf="$HOME/.config/godot"
          mkdir -p "$conf"
          cat > "$conf/editor_settings-${GODOT_VERSION%.*}.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$dbg"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' "$conf/editor_settings-${GODOT_VERSION%.*}.tres"

      - name: Version from package.json
        id: ver
        run: |
          v="$(node -p "require('./package.json').version")"
          IFS=. read -r major minor patch <<< "$v"
          code=$((major * 1000000 + minor * 1000 + patch))
          sed -i "s/^version\/name=.*/version\/name=\"$v\"/; s/^version\/code=.*/version\/code=$code/" godot/export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"$v\"/" godot/project.godot
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v (code $code)"

      - name: Import and export
        working-directory: godot
        run: |
          godot --headless --import --path . || true
          mkdir -p build
          godot --headless --path . --export-release Android "build/arena-legends-${{ steps.ver.outputs.version }}.apk"
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: arena-legends-${{ steps.ver.outputs.version }}-apk
          path: godot/build/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          tag="android-v$v"
          apk="godot/build/arena-legends-$v.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Arena Legends $v (Android)" \
              --notes "Android build of Arena Legends $v. Install the APK on your phone (allow installs from your browser or files app)."
          fi
